<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Şube Maaş Programı</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--border:#334155;--text:#f1f5f9;--muted:#94a3b8;--accent:#3b82f6;--accent-hover:#2563eb;--danger:#ef4444;--success:#10b981}
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;margin:0;background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);color:var(--text);min-height:100vh}
.container{max-width:1200px;margin:0 auto;padding:24px}
header{background:rgba(30,41,59,.8);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:24px;box-shadow:0 4px 20px rgba(0,0,0,.3)}
header h1{margin:0;font-size:28px;font-weight:700;background:linear-gradient(90deg,#60a5fa,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
header p{margin:6px 0 0;color:var(--muted);font-size:15px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:20px;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.card h3{margin:0 0 16px;font-size:18px;font-weight:600;color:#e2e8f0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
input,select{background:#0f172a;border:1px solid var(--border);color:var(--text);padding:12px 14px;border-radius:10px;font-size:14px;width:100%;transition:.2s}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.2)}
button{background:var(--accent);color:#fff;border:0;padding:12px 18px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;transition:.2s}
button:hover{background:var(--accent-hover);transform:translateY(-1px)}
button.danger{background:var(--danger)}
button.danger:hover{background:#dc2626}
button.secondary{background:#475569}
button.secondary:hover{background:#334155}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:#0f172a;color:var(--muted);font-weight:600;text-transform:uppercase;font-size:12px;letter-spacing:.5px}
th,td{padding:12px 10px;text-align:left;border-bottom:1px solid var(--border)}
tr:hover td{background:rgba(255,255,255,.03)}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;background:#1e40af;color:#bfdbfe}
.sube-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.sube-item{background:#0f172a;border:1px solid var(--border);padding:8px 14px;border-radius:24px;font-size:13px;display:flex;align-items:center;gap:8px}
.net{color:var(--success);font-weight:700}
@media(max-width:700px){.container{padding:16px}.grid{grid-template-columns:1fr}header h1{font-size:22px}}
</style>
</head>
<body>
<div class="container">
<header>
<h1>Şube Personel Maaş Programı</h1>
<p>Tüm şubeler • Yeni şube ekleme • Profesyonel maaş hesaplama</p>
</header>

<div class="card">
<h3>Şube Yönetimi</h3>
<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
<input id="yeniSube" placeholder="Yeni şube adı" style="max-width:240px">
<button class="secondary" onclick="subeEkle()">+ Şube Ekle</button>
</div>
<div class="sube-list" id="subeListesi"></div>
</div>

<div class="card">
<h3>Personel Ekle</h3>
<div class="grid">
<input id="ad" placeholder="Ad Soyad">
<input id="poz" placeholder="Pozisyon">
<select id="sube"></select>
<input id="brut" type="number" placeholder="Brüt Maaş (₺)">
<input id="gun" type="number" value="30" placeholder="Çalışılan Gün">
<input id="mesai" type="number" value="0" placeholder="Fazla Mesai (saat)">
<input id="prim" type="number" value="0" placeholder="Prim / Bahşiş (₺)">
<input id="avans" type="number" value="0" placeholder="Avans (₺)">
</div>
<button onclick="ekle()" style="margin-top:16px">Kaydet</button>
</div>

<div class="card">
<h3>Personel Listesi</h3>
<div style="overflow-x:auto">
<table id="tablo">
<thead>
<tr>
<th>Ad</th><th>Pozisyon</th><th>Şube</th><th>Brüt</th><th>Gün</th><th>Mesai</th><th>Prim</th><th>Avans</th><th>Net</th><th></th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>
</div>

<div class="card">
<h3>Şube Özeti</h3>
<div id="ozet"></div>
</div>
</div>

<script>
let subeler = JSON.parse(localStorage.getItem("subeler") || "null") || ["Bağdat Caddesi", "Kadıköy", "Çengelköy", "Talsim Pide", "Taksim Büfe"];
let personel = JSON.parse(localStorage.getItem("personel") || "null") || [
  {id:1, ad:"Ahmet Yılmaz", poz:"Garson", sube:"Kadıköy", brut:45000, gun:30, mesai:8, prim:2500, avans:0},
  {id:2, ad:"Ayşe Demir", poz:"Aşçı", sube:"Bağdat Caddesi", brut:55000, gun:28, mesai:12, prim:1500, avans:3000},
  {id:3, ad:"Mehmet Kaya", poz:"Kasiyer", sube:"Taksim Büfe", brut:42000, gun:30, mesai:0, prim:0, avans:0}
];
let nextId = personel.length ? Math.max(...personel.map(p=>p.id))+1 : 1;

function subeSelectDoldur(){
  const sel = document.getElementById("sube");
  sel.innerHTML = subeler.map(s => `<option>${s}</option>`).join("");
}

function subeListesiCiz(){
  const el = document.getElementById("subeListesi");
  el.innerHTML = subeler.map(s => `<div class="sube-item">${s} <button class="danger" style="padding:4px 8px;font-size:12px" onclick="subeSil('${s}')">×</button></div>`).join("");
}

function subeEkle(){
  const ad = document.getElementById("yeniSube").value.trim();
  if(!ad) return alert("Şube adı gir");
  if(subeler.includes(ad)) return alert("Bu şube zaten var");
  subeler.push(ad);
  localStorage.setItem("subeler", JSON.stringify(subeler));
  document.getElementById("yeniSube").value = "";
  subeSelectDoldur();
  subeListesiCiz();
  ciz();
}

function subeSil(ad){
  if(personel.some(p => p.sube === ad)) return alert("Bu şubede personel var, önce personeli taşı veya sil");
  if(confirm(ad + " şubesini sil?")){
    subeler = subeler.filter(s => s !== ad);
    localStorage.setItem("subeler", JSON.stringify(subeler));
    subeSelectDoldur();
    subeListesiCiz();
    ciz();
  }
}

function netHesap(p){
  const gunOran = Math.min(p.gun,30)/30;
  const brut = p.brut * gunOran;
  const mesaiUcret = (p.brut / 225) * p.mesai * 1.5;
  const toplamHakedis = brut + mesaiUcret + (p.prim||0);
  const sgk = toplamHakedis * 0.14;
  const issizlik = toplamHakedis * 0.01;
  const matrah = toplamHakedis - sgk - issizlik;
  const gv = Math.max(0, (matrah - 28075.5) * 0.15);
  const damga = toplamHakedis * 0.00759;
  const net = toplamHakedis - sgk - issizlik - gv - damga - (p.avans||0);
  return Math.round(net);
}

function ciz(){
  localStorage.setItem("personel", JSON.stringify(personel));
  const tb = document.querySelector("#tablo tbody");
  tb.innerHTML = "";
  const subeToplam = {};
  personel.forEach(p => {
    const net = netHesap(p);
    tb.innerHTML += `<tr>
      <td>${p.ad}</td>
      <td>${p.poz}</td>
      <td><span class="badge">${p.sube}</span></td>
      <td>${p.brut.toLocaleString()} ₺</td>
      <td>${p.gun}</td>
      <td>${p.mesai} sa</td>
      <td>${(p.prim||0).toLocaleString()} ₺</td>
      <td>${(p.avans||0).toLocaleString()} ₺</td>
      <td class="net">${net.toLocaleString()} ₺</td>
      <td><button class="danger" style="padding:6px 10px;font-size:12px" onclick="sil(${p.id})">Sil</button></td>
    </tr>`;
    if(!subeToplam[p.sube]) subeToplam[p.sube] = {brut:0, net:0, adet:0};
    subeToplam[p.sube].brut += p.brut;
    subeToplam[p.sube].net += net;
    subeToplam[p.sube].adet++;
  });
  let oz = "<table><thead><tr><th>Şube</th><th>Kişi</th><th>Toplam Brüt</th><th>Toplam Net</th></tr></thead><tbody>";
  subeler.forEach(s => {
    const t = subeToplam[s] || {brut:0, net:0, adet:0};
    oz += `<tr><td>${s}</td><td>${t.adet}</td><td>${t.brut.toLocaleString()} ₺</td><td class="net">${t.net.toLocaleString()} ₺</td></tr>`;
  });
  oz += "</tbody></table>";
  document.getElementById("ozet").innerHTML = oz;
}

function ekle(){
  const ad = document.getElementById("ad").value.trim();
  const poz = document.getElementById("poz").value.trim();
  const sube = document.getElementById("sube").value;
  const brut = Number(document.getElementById("brut").value);
  const gun = Number(document.getElementById("gun").value) || 30;
  const mesai = Number(document.getElementById("mesai").value) || 0;
  const prim = Number(document.getElementById("prim").value) || 0;
  const avans = Number(document.getElementById("avans").value) || 0;
  if(!ad || !brut) return alert("Ad ve brüt maaş zorunlu");
  personel.push({id:nextId++, ad, poz, sube, brut, gun, mesai, prim, avans});
  ciz();
  ["ad","poz","brut"].forEach(id => document.getElementById(id).value="");
  document.getElementById("gun").value = 30;
  document.getElementById("mesai").value = 0;
  document.getElementById("prim").value = 0;
  document.getElementById("avans").value = 0;
}

function sil(id){
  if(confirm("Silinsin mi?")){
    personel = personel.filter(p => p.id !== id);
    ciz();
  }
}

subeSelectDoldur();
subeListesiCiz();
ciz();
</script>
</body>
</html>
